<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serving Static Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">Serving Static Files in Flask</h1>
            <p class="lead text-muted">
                A simple Flask project that serves downloadable static files like ZIP files.
            </p>
        </div>

        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body text-center p-5">
                <h2 class="card-title mb-3">Download Template</h2>

                <p class="card-text text-muted">
                    Click the button below to download the sample ZIP file from the static folder.
                </p>

                <a href="/static/1.zip" download class="btn btn-primary btn-lg">
                    Download ZIP File
                </a>
            </div>
        </div>

    </div>

</body>
</html>
